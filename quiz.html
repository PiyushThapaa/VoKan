<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VoKan Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="quiz-container" class="quiz-container">
    <h1>VoKan Quiz</h1>
    <div id="loading">Loading...</div>
    <div id="quiz-box" style="display: none;">
      <p><strong>Kanji No:</strong> <span id="sno"></span></p>
      <p id="kanji"></p>

      <input type="text" id="input" placeholder="Enter Hiragana or Romaji" />

      <button id="check">Check</button>
      <p id="reading"><b>Reading : </b></p>
      <p id="meaning"><b>Meaning : </b></p>
      <div id="kanjiContainer"></div>
      <p></p>
      <p id="result"></p>
      <button id="move-forward">Move Forward</button>
    </div>
  </div>

  <div class="result-container" id="resultContainer" style="display: none;">
    <h1>🎉 Quiz Finished</h1>
    <p id="score"></p>
    <a href="index.html">Go to Home</a>
  </div>

  <script type="module" src="quiz.js"></script>
</body>
</html>
